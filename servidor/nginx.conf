# Mini Mural no nginx com PHP-FPM.
#
# No Debian e no Ubuntu, copie para /etc/nginx/sites-available/mini-mural,
# crie o atalho e recarregue:
#   sudo ln -s /etc/nginx/sites-available/mini-mural /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# O nginx não executa PHP. Ele entrega CSS e JavaScript direto e repassa cada
# pedido de arquivo .php ao PHP-FPM, um processo separado, pelo protocolo
# FastCGI. Troque /var/www/mini-mural pela pasta do projeto.

server {
    # Porta própria: a 80 é do site padrão do nginx no Debian e no Ubuntu, e a
    # 8080, do site padrão no Homebrew.
    listen 8081;
    server_name localhost;

    # Só a pasta public/ fica visível. src/, sql/ e config.php ficam um nível
    # acima e o nginx não os entrega.
    root /var/www/mini-mural/public;
    index index.php;

    # Endereço sem arquivo correspondente responde 404.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        # Sem esta linha, um pedido para um .php inexistente chegaria ao
        # PHP-FPM, que responderia com erro.
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Onde o PHP-FPM escuta. No Ubuntu 24.04, com PHP 8.3, é este socket;
        # confira o nome com: ls /run/php/
        # No macOS com Homebrew, o PHP-FPM escuta em 127.0.0.1:9000.
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
