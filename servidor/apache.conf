# Mini Mural no Apache com mod_php.
#
# No Debian e no Ubuntu, copie para /etc/apache2/sites-available/mini-mural.conf
# e ative com:
#   sudo a2ensite mini-mural
#   sudo systemctl reload apache2
#
# O pacote libapache2-mod-php já liga o PHP aos arquivos .php; este arquivo só
# diz onde está o site. Troque /var/www/mini-mural pela pasta do projeto.

# Porta própria, para não disputar a porta 80 com o site padrão do Apache.
Listen 8081

<VirtualHost *:8081>
    ServerName localhost

    # Só a pasta public/ fica visível. src/, sql/ e config.php ficam um nível
    # acima e o Apache não os entrega.
    DocumentRoot /var/www/mini-mural/public

    <Directory /var/www/mini-mural/public>
        # Pasta sem index.php não vira lista de arquivos.
        Options -Indexes
        # Ignora .htaccess: toda a configuração está neste arquivo.
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # O PHP manda para cá o que error_log() escreve, inclusive as exceções
    # registradas em src/inicializar.php.
    ErrorLog ${APACHE_LOG_DIR}/mini-mural-erro.log
    CustomLog ${APACHE_LOG_DIR}/mini-mural-acesso.log combined
</VirtualHost>
