# Site do Mini Mural dentro do contêiner. É o servidor/apache.conf com duas
# diferenças: escuta na porta 80 do contêiner, e os logs vão para a saída do
# contêiner, onde o "docker compose logs" os mostra.

<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/mini-mural/public

    <Directory /var/www/mini-mural/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
